<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liga Fronteo Obelisco 2026 - Oficial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            heading: ['"Chakra Petch"', 'sans-serif'],
            score: ['"Teko"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #030712; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-heading { font-family: 'Chakra Petch', sans-serif; }
    .font-score { font-family: 'Teko', sans-serif; letter-spacing: 0.05em; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #030712; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-cyan-500 selection:text-slate-950">
  <div id="app" class="flex-1 flex flex-col">
    <!-- Header -->
    <header class="sticky top-0 z-40 bg-slate-950/95 backdrop-blur-md border-b border-white/10 px-4 py-3">
      <div class="max-w-7xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-600 to-emerald-950 border border-emerald-400/40 flex items-center justify-center font-bold text-emerald-300 text-lg shadow-md">
            ⚽
          </div>
          <div>
            <h1 class="text-base sm:text-xl font-bold font-heading uppercase tracking-wider text-white">LIGA FRONTEO OBELISCO</h1>
            <p class="text-xs text-emerald-400 font-semibold tracking-widest">TEMPORADA OFICIAL 2026</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">
            <span class="w-2 h-2 rounded-full bg-cyan-400"></span>
            Inicio Oficial • 0 Pts
          </span>
        </div>
      </div>
    </header>

    <!-- Navigation tabs -->
    <nav class="bg-slate-900/80 border-b border-white/5 sticky top-[57px] z-30 px-4">
      <div class="max-w-7xl mx-auto flex gap-1 sm:gap-2 overflow-x-auto py-2">
        <button onclick="setTab('fixture')" id="tab-fixture" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap bg-cyan-500 text-slate-950 font-bold">🏆 Fixture & Partidos</button>
        <button onclick="setTab('posiciones')" id="tab-posiciones" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap text-slate-400 hover:text-white">📊 Tabla Posiciones (0-0)</button>
        <button onclick="setTab('goleadores')" id="tab-goleadores" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap text-slate-400 hover:text-white">⚽ Botín de Oro</button>
        <button onclick="setTab('equipos')" id="tab-equipos" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap text-slate-400 hover:text-white">🛡️ Equipos y Plantillas</button>
        <button onclick="setTab('admin')" id="tab-admin" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap text-amber-400 hover:text-amber-300">⚙️ Panel Admin (Inscripción & Goles)</button>
      </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto w-full p-4 sm:p-6 flex-1">
      <div id="content-view"></div>
    </main>
  </div>

  <script>
    // 12 Official Teams starting with 0 PTS, 0 PJ
    const DB = {
      teams: [
        { id: "team-1", name: "ALPHA", shortName: "ALP", captainName: "Por Definir", coach: "Roberto Méndez", homeCourt: "Cancha Central Obelisco", foundedYear: 2021, description: "Equipo de alta intensidad y juego colectivo veloz." },
        { id: "team-2", name: "CAIMANES FC", shortName: "CAI", captainName: "Por Definir", coach: "Luis Carmona", homeCourt: "Polideportivo Fronteo - Cancha 1", foundedYear: 2019, description: "Defensa sólida como roca y transiciones ofensivas fulminantes." },
        { id: "team-3", name: "CARUCIENA SC", shortName: "CAR", captainName: "Por Definir", coach: "Pietro Moretti", homeCourt: "Complejo Deportivo Norte", foundedYear: 2018, description: "Estilo clásico tradicional a rayas verticales, posesión pulcra y orden." },
        { id: "team-4", name: "CRISBAN FC", shortName: "CRI", captainName: "Por Definir", coach: "Hernán Silva", homeCourt: "Cancha Las Acacias", foundedYear: 2020, description: "El poder estelar del torneo, juego dinámico de bandas y remates lejanos." },
        { id: "team-5", name: "DEPORTIVO SIN LUZ", shortName: "DSL", captainName: "Por Definir", coach: "Esteban Paredes", homeCourt: "Estadio Nocturno El Faro", foundedYear: 2022, description: "Expertos en rematar partidos en los minutos finales; nunca bajan los brazos." },
        { id: "team-6", name: "ELITE F.C.", shortName: "ELI", captainName: "Por Definir", coach: "Maximiliano Costa", homeCourt: "Coliseo Don Bosco", foundedYear: 2017, description: "Uno de los clubes fundadores con palmarés de títulos en futsal y fútbol 7." },
        { id: "team-7", name: "FAMILIS FC", shortName: "FAM", captainName: "Por Definir", coach: "Germán Denis", homeCourt: "Parque La Frontera", foundedYear: 2023, description: "Jóvenes promesas con energía incansable, presión alta y presión asfixiante." },
        { id: "team-8", name: "HALCONES FC", shortName: "HAL", captainName: "Por Definir", coach: "Matías Almeyda", homeCourt: "Cancha Sintética San José", foundedYear: 2019, description: "Juego vertical y aéreo temido en toda la liga, especialistas a balón parado." },
        { id: "team-9", name: "LEONES FC", shortName: "LEO", captainName: "Por Definir", coach: "Claudio Borghi", homeCourt: "Polideportivo Fronteo - Cancha 2", foundedYear: 2020, description: "Garra, corazón y orgullo competitivo. Nunca dan un balón por perdido." },
        { id: "team-10", name: "LOS CHAMOS FC", shortName: "CHA", captainName: "Por Definir", coach: "Rafael Dudamel", homeCourt: "Cancha El Triunfo", foundedYear: 2021, description: "Toque corto, alegría en la cancha, gambeta y finalización quirúrgica." },
        { id: "team-11", name: "NEW FC", shortName: "NEW", captainName: "Por Definir", coach: "Marcelo Rossi", homeCourt: "Cancha La Estrella", foundedYear: 2024, description: "El debutante sensación de 2026 con figuras de élite y refuerzos estelares." },
        { id: "team-12", name: "SPORTING VISAJE", shortName: "VIS", captainName: "Por Definir", coach: "Jorge Sampaoli", homeCourt: "Arena Los Álamos", foundedYear: 2022, description: "Fútbol total de desmarques impredecibles y remates potentes de media distancia." }
      ],
      players: [], // Clean start
      matches: [
        { id: "m-1", round: 1, homeTeamId: "team-1", awayTeamId: "team-2", homeScore: null, awayScore: null, status: "SCHEDULED", date: "2026-10-24", time: "18:00", court: "Cancha Central Obelisco", referee: "Carlos Ramos (Colegio Oficial)" },
        { id: "m-2", round: 1, homeTeamId: "team-4", awayTeamId: "team-3", homeScore: null, awayScore: null, status: "SCHEDULED", date: "2026-10-24", time: "19:30", court: "Polideportivo Fronteo - Cancha 1", referee: "Jesús Valenzuela" },
        { id: "m-3", round: 1, homeTeamId: "team-6", awayTeamId: "team-5", homeScore: null, awayScore: null, status: "SCHEDULED", date: "2026-10-24", time: "21:00", court: "Coliseo Don Bosco", referee: "Wilmar Roldán" },
        { id: "m-4", round: 1, homeTeamId: "team-8", awayTeamId: "team-7", homeScore: null, awayScore: null, status: "SCHEDULED", date: "2026-10-25", time: "18:00", court: "Cancha Sintética San José", referee: "Piero Maza" },
        { id: "m-5", round: 1, homeTeamId: "team-10", awayTeamId: "team-9", homeScore: null, awayScore: null, status: "SCHEDULED", date: "2026-10-25", time: "19:30", court: "Cancha El Triunfo", referee: "Facundo Tello" },
        { id: "m-6", round: 1, homeTeamId: "team-11", awayTeamId: "team-12", homeScore: null, awayScore: null, status: "SCHEDULED", date: "2026-10-25", time: "21:00", court: "Cancha La Estrella", referee: "Carlos Ramos" }
      ],
      user: { isAuthenticated: false, email: null, name: null }
    };

    let currentTab = 'posiciones';

    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap text-slate-400 hover:text-white';
      });
      const activeBtn = document.getElementById('tab-' + tab);
      if (activeBtn) {
        activeBtn.className = 'tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap bg-cyan-500 text-slate-950 font-bold';
      }
      render();
    }

    function calculateStandings() {
      const map = {};
      DB.teams.forEach(t => {
        map[t.id] = { team: t, pj: 0, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0, dg: 0, pts: 0 };
      });

      DB.matches.filter(m => m.status === 'FINISHED' && m.homeScore !== null).forEach(m => {
        const h = map[m.homeTeamId];
        const a = map[m.awayTeamId];
        if (!h || !a) return;
        h.pj++; a.pj++;
        h.gf += m.homeScore; h.gc += m.awayScore; h.dg = h.gf - h.gc;
        a.gf += m.awayScore; a.gc += m.homeScore; a.dg = a.gf - a.gc;

        if (m.homeScore > m.awayScore) {
          h.pg++; h.pts += 3; a.pp++;
        } else if (m.homeScore < m.awayScore) {
          a.pg++; a.pts += 3; h.pp++;
        } else {
          h.pe++; a.pe++; h.pts += 1; a.pts += 1;
        }
      });

      return Object.values(map).sort((a,b) => b.pts - a.pts || b.dg - a.dg || b.gf - a.gf || a.team.name.localeCompare(b.team.name));
    }

    function render() {
      const container = document.getElementById('content-view');
      if (currentTab === 'fixture') renderFixture(container);
      else if (currentTab === 'posiciones') renderStandings(container);
      else if (currentTab === 'goleadores') renderScorers(container);
      else if (currentTab === 'equipos') renderTeams(container);
      else if (currentTab === 'admin') renderAdmin(container);
    }

    function getTeam(id) {
      return DB.teams.find(t => t.id === id) || { name: 'Desconocido', shortName: '???' };
    }

    function renderStandings(container) {
      const standings = calculateStandings();
      let html = '<div class="bg-slate-900/80 border border-white/10 rounded-2xl overflow-hidden shadow-2xl">';
      html += '<div class="p-4 sm:p-5 border-b border-white/10 flex items-center justify-between">';
      html += '<div><h2 class="text-lg font-bold font-heading text-white">TABLA DE POSICIONES - LIGA FRONTEO OBELISCO</h2><p class="text-xs text-slate-400">Liga Inicial 2026 • Todos los equipos inician igualados en cero</p></div>';
      html += '<span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Oficial 2026</span>';
      html += '</div>';
      html += '<div class="overflow-x-auto"><table class="w-full text-left text-xs sm:text-sm">';
      html += '<thead class="bg-slate-950 text-xs text-slate-400 uppercase font-semibold">';
      html += '<tr><th class="p-3 text-center">#</th><th class="p-3">EQUIPO</th><th class="p-3 text-center">PJ</th><th class="p-3 text-center">G</th><th class="p-3 text-center">E</th><th class="p-3 text-center">P</th><th class="p-3 text-center">GF</th><th class="p-3 text-center">GC</th><th class="p-3 text-center">DG</th><th class="p-3 text-center font-bold text-cyan-400">PTS</th></tr>';
      html += '</thead><tbody class="divide-y divide-white/5">';
      standings.forEach((s, idx) => {
        html += '<tr class="hover:bg-white/[0.02]">';
        html += '<td class="p-3 text-center font-bold text-slate-400">' + (idx + 1) + '</td>';
        html += '<td class="p-3 font-bold text-white">' + s.team.name + '</td>';
        html += '<td class="p-3 text-center">' + s.pj + '</td>';
        html += '<td class="p-3 text-center text-emerald-400 font-semibold">' + s.pg + '</td>';
        html += '<td class="p-3 text-center text-amber-400">' + s.pe + '</td>';
        html += '<td class="p-3 text-center text-rose-400">' + s.pp + '</td>';
        html += '<td class="p-3 text-center">' + s.gf + '</td>';
        html += '<td class="p-3 text-center">' + s.gc + '</td>';
        html += '<td class="p-3 text-center font-semibold text-slate-400">' + s.dg + '</td>';
        html += '<td class="p-3 text-center font-score text-2xl font-bold text-cyan-400">' + s.pts + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div></div>';
      container.innerHTML = html;
    }

    function renderScorers(container) {
      let html = '<div class="space-y-4">';
      html += '<h2 class="text-xl font-bold font-heading text-white">Ranking de Goleadores (Botín de Oro)</h2>';
      if (DB.players.filter(p => p.goals > 0).length === 0) {
        html += '<div class="bg-slate-900/80 border border-white/10 rounded-2xl p-10 text-center shadow-lg">';
        html += '<div class="text-4xl mb-3">🏆</div>';
        html += '<h3 class="text-base font-bold text-white mb-1">Tabla de Goleadores sin goles registrados aún</h3>';
        html += '<p class="text-xs text-slate-400">Tan pronto como se juegue el primer partido y el administrador cargue los goles, aquí aparecerá el podio.</p>';
        html += '</div>';
      }
      html += '</div>';
      container.innerHTML = html;
    }

    function renderFixture(container) {
      let html = '<div class="space-y-4"><h2 class="text-xl font-bold font-heading text-white">Fixture y Calendario Oficial 2026</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-4">';
      DB.matches.forEach(m => {
        const h = getTeam(m.homeTeamId);
        const a = getTeam(m.awayTeamId);
        html += '<div class="bg-slate-900/80 border border-white/10 rounded-2xl p-4">';
        html += '<div class="flex items-center justify-between text-xs text-slate-400 mb-2"><span>Jornada ' + m.round + ' • ' + m.date + ' ' + m.time + '</span><span class="px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300 font-bold text-[10px]">PROGRAMADO</span></div>';
        html += '<div class="flex items-center justify-between my-2">';
        html += '<div class="flex-1 text-right font-bold text-white">' + h.name + '</div>';
        html += '<div class="px-3 py-1 bg-slate-950 border border-white/10 rounded-xl font-score text-2xl text-cyan-400 font-bold min-w-[64px] text-center">- : -</div>';
        html += '<div class="flex-1 text-left font-bold text-white">' + a.name + '</div>';
        html += '</div>';
        html += '<div class="text-xs text-slate-400 border-t border-white/5 pt-2 flex justify-between"><span>🏟️ ' + m.court + '</span><span>⚖️ ' + m.referee + '</span></div>';
        html += '</div>';
      });
      html += '</div></div>';
      container.innerHTML = html;
    }

    function renderTeams(container) {
      let html = '<div class="space-y-4"><h2 class="text-xl font-bold font-heading text-white">Equipos Participantes (12 Clubes)</h2><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">';
      DB.teams.forEach(t => {
        const count = DB.players.filter(p => p.teamId === t.id).length;
        html += '<div class="bg-slate-900/80 border border-white/10 rounded-2xl p-5 hover:border-cyan-500/40 transition">';
        html += '<div class="flex justify-between items-start mb-2"><h3 class="text-lg font-bold text-white font-heading">' + t.name + '</h3><span class="text-xs text-cyan-400 font-bold">' + t.shortName + '</span></div>';
        html += '<p class="text-xs text-slate-400 mb-3">' + t.description + '</p>';
        html += '<div class="text-xs space-y-1 text-slate-300 border-t border-white/5 pt-2">';
        html += '<div>👑 <strong>Capitán:</strong> ' + t.captainName + '</div>';
        html += '<div>📋 <strong>DT:</strong> ' + t.coach + '</div>';
        html += '<div>🏟️ <strong>Cancha:</strong> ' + t.homeCourt + '</div>';
        html += '<div>👥 <strong>Inscritos:</strong> ' + count + ' atletas</div>';
        html += '</div></div>';
      });
      html += '</div></div>';
      container.innerHTML = html;
    }

    function renderAdmin(container) {
      let html = '<div class="bg-slate-900/80 border border-white/10 rounded-2xl p-6 max-w-xl mx-auto space-y-4">';
      html += '<h2 class="text-xl font-bold font-heading text-white">Inscripción Oficial de Jugadores</h2>';
      html += '<form onsubmit="handleAddPlayer(event)" class="space-y-3">';
      html += '<div><label class="block text-xs text-slate-400 mb-1">Club / Equipo</label><select id="p-team" class="w-full bg-slate-950 border border-white/10 rounded-lg p-2 text-xs text-white">';
      DB.teams.forEach(t => { html += '<option value="' + t.id + '">' + t.name + '</option>'; });
      html += '</select></div>';
      html += '<div><label class="block text-xs text-slate-400 mb-1">Nombre Completo *</label><input type="text" id="p-name" required placeholder="Ej. Roberto Gómez" class="w-full bg-slate-950 border border-white/10 rounded-lg p-2 text-xs text-white"></div>';
      html += '<div class="grid grid-cols-2 gap-2">';
      html += '<div><label class="block text-xs text-slate-400 mb-1">Cédula C.I. / DNI *</label><input type="text" id="p-dni" required placeholder="V-27.123.456" class="w-full bg-slate-950 border border-white/10 rounded-lg p-2 text-xs text-white"></div>';
      html += '<div><label class="block text-xs text-slate-400 mb-1">Teléfono / Contacto *</label><input type="tel" id="p-phone" required placeholder="0412-1234567" class="w-full bg-slate-950 border border-white/10 rounded-lg p-2 text-xs text-white"></div>';
      html += '</div>';
      html += '<div class="grid grid-cols-3 gap-2">';
      html += '<div><label class="block text-xs text-slate-400 mb-1">Dorsal (#) *</label><input type="number" min="1" max="99" id="p-dorsal" value="10" required class="w-full bg-slate-950 border border-white/10 rounded-lg p-2 text-xs text-white"></div>';
      html += '<div><label class="block text-xs text-slate-400 mb-1">Edad *</label><input type="number" min="15" max="60" id="p-age" value="22" required class="w-full bg-slate-950 border border-white/10 rounded-lg p-2 text-xs text-white"></div>';
      html += '<div><label class="block text-xs text-slate-400 mb-1">Posición *</label><select id="p-pos" class="w-full bg-slate-950 border border-white/10 rounded-lg p-2 text-xs text-white"><option value="POR">Portero</option><option value="CIE">Cierre</option><option value="ALA" selected>Ala</option><option value="PIV">Pívot</option><option value="DEL">Delantero</option></select></div>';
      html += '</div>';
      html += '<button type="submit" class="w-full py-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-lg text-xs transition cursor-pointer">Inscribir Jugador en la Base de Datos</button>';
      html += '</form></div>';
      container.innerHTML = html;
    }

    function handleAddPlayer(e) {
      e.preventDefault();
      const teamId = document.getElementById('p-team').value;
      const name = document.getElementById('p-name').value;
      const dni = document.getElementById('p-dni').value;
      const phone = document.getElementById('p-phone').value;
      const dorsal = parseInt(document.getElementById('p-dorsal').value, 10);
      const age = parseInt(document.getElementById('p-age').value, 10);
      const pos = document.getElementById('p-pos').value;

      DB.players.push({
        id: 'p-' + Date.now(),
        teamId: teamId,
        name: name,
        dni: dni,
        phone: phone,
        dorsal: dorsal,
        age: age,
        position: pos,
        goals: 0,
        assists: 0
      });

      alert('¡Atleta ' + name + ' registrado exitosamente!');
      setTab('equipos');
    }

    render();
  </script>
</body>
</html>
